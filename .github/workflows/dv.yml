name: DV regression

# Runs only on push. A pull request uses the check results of its head commit,
# which were reported by the push to the PR branch.
on:
  push:

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still in progress.
concurrency:
  group: dv-${{ github.ref }}
  cancel-in-progress: true

# Tool versions follow the reference development environment: Ubuntu 24.04
# with its system Python 3.12 and RISC-V GCC packages, and the OSS CAD Suite
# release below for Verilator. Python packages are pinned in dv/requirements.txt
# and hal/requirements.txt.
env:
  OSS_CAD_SUITE_RELEASE: "2026-09-09"
  OSS_CAD_SUITE_ARCHIVE: oss-cad-suite-linux-x64-20260909.tgz
  OSS_CAD_SUITE_SHA256: 9f09730c7a168c5a0b829354e36f2fd517ed63f32aecebc43c4691528b5c04a8

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      suites: ${{ steps.discover.outputs.suites }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Every discovered suite becomes one entry of the test matrix:
      #   dv/{core,endpoints}/<suite>/test_<suite>.py and dv/traffic run with pytest,
      #   dv/hal/<suite>/Makefile runs the cocotb Make flow.
      # The flags select the extra setup each suite needs.
      - name: Discover dv test suites
        id: discover
        run: |
          python3 - <<'EOF'
          import json
          import os
          from pathlib import Path

          def suite(path, run):
              name = path.relative_to("dv").as_posix()
              group = name.split("/")[0]
              return {
                  "name": name,
                  "id": name.replace("/", "-"),
                  "dir": path.as_posix(),
                  "run": run,
                  "hal": group in ("endpoints", "hal"),
                  "firmware": group == "endpoints",
              }

          dv = Path("dv")
          pytest_dirs = [*dv.glob("core/*/"), *dv.glob("endpoints/*/"), dv / "traffic"]
          suites = [suite(d, "pytest") for d in sorted(pytest_dirs)
                    if (d / f"test_{d.name}.py").is_file()]
          suites += [suite(d, "make") for d in sorted(dv.glob("hal/*/"))
                     if (d / "Makefile").is_file()]

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"suites={json.dumps(suites)}", file=output)
          for entry in suites:
              print(f"{entry['name']}: {entry['run']}")
          EOF

      # Downloads OSS CAD Suite only when it is not cached yet. The cache is
      # saved automatically when this job finishes.
      - name: Check OSS CAD Suite cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: ${{ env.OSS_CAD_SUITE_ARCHIVE }}
          lookup-only: true

      - name: Download OSS CAD Suite
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$OSS_CAD_SUITE_ARCHIVE" \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE_RELEASE/$OSS_CAD_SUITE_ARCHIVE"
          echo "$OSS_CAD_SUITE_SHA256  $RUNNER_TEMP/$OSS_CAD_SUITE_ARCHIVE" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$OSS_CAD_SUITE_ARCHIVE" -C "$RUNNER_TEMP"
          rm "$RUNNER_TEMP/$OSS_CAD_SUITE_ARCHIVE"

  test:
    name: ${{ matrix.suite.name }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # Keep running the remaining suites when one of them fails.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.prepare.outputs.suites) }}
    env:
      SUITE_NAME: ${{ matrix.suite.name }}
      SUITE_RUN: ${{ matrix.suite.run }}
      NEEDS_HAL: ${{ matrix.suite.hal }}
      NEEDS_FIRMWARE: ${{ matrix.suite.firmware }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # .gitmodules uses SSH URLs, which need a key the runner does not have.
      - name: Fetch submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          submodules=(libs/taxi)
          if [ "$NEEDS_FIRMWARE" = true ]; then submodules+=(libs/picorv32); fi
          git submodule update --init --depth 1 "${submodules[@]}"

      - name: Install system packages
        run: |
          packages=(python3-dev python3-venv)
          if [ "$NEEDS_FIRMWARE" = true ]; then
            packages+=(binutils-riscv64-unknown-elf gcc-riscv64-unknown-elf xxd)
          fi
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends "${packages[@]}"

      - name: Restore OSS CAD Suite
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/oss-cad-suite
          key: ${{ env.OSS_CAD_SUITE_ARCHIVE }}
          fail-on-cache-miss: true

      # Python packages go into a virtual environment based on the system
      # Python. Its bin directory is placed in front of the OSS CAD Suite
      # environment, so python3, pytest, and cocotb-config come from the pinned
      # packages while Verilator comes from OSS CAD Suite. The venv activate
      # script is not used because it would undo the OSS CAD Suite environment.
      - name: Set up tools
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          requirements=(-r dv/requirements.txt)
          if [ "$NEEDS_HAL" = true ]; then requirements+=(-r hal/requirements.txt); fi
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check \
            "${requirements[@]}"
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          {
            echo "PATH=$RUNNER_TEMP/venv/bin:$PATH"
            echo "VIRTUAL_ENV=$RUNNER_TEMP/venv"
            echo "VERILATOR_ROOT=$VERILATOR_ROOT"
          } >> "$GITHUB_ENV"

      - name: Show tool versions
        run: |
          python --version
          python -m pip list --disable-pip-version-check
          cocotb-config --version
          verilator --version
          if [ "$NEEDS_FIRMWARE" = true ]; then riscv64-unknown-elf-gcc --version | head -n 1; fi

      - name: Generate HAL
        if: matrix.suite.hal
        run: make -C hal

      - name: Run ${{ matrix.suite.name }} tests
        working-directory: ${{ matrix.suite.dir }}
        run: |
          case "$SUITE_RUN" in
            pytest)
              python -m pytest "test_$(basename "$PWD").py" -v \
                --junitxml="$GITHUB_WORKSPACE/build/dv/$SUITE_NAME/report.xml"
              ;;
            make)
              make
              ;;
            *)
              echo "Unknown suite runner: $SUITE_RUN" >&2
              exit 1
              ;;
          esac

      # Runs for passing and failing suites. The artifact contains the pytest
      # report and the cocotb results of every simulated configuration.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: dv-${{ matrix.suite.id }}
          path: |
            build/dv/${{ matrix.suite.name }}/report.xml
            build/dv/${{ matrix.suite.name }}/**/*results.xml
          if-no-files-found: ignore
          retention-days: 14

  # One stable check that is green only when every suite passed. Use this one
  # as the required status check for branch protection.
  result:
    name: DV result
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check test results
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "dv regression result: $RESULT"
          test "$RESULT" = "success"
