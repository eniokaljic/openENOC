name: DV openenoc_axis_demux

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OSS_CAD_SUITE_RELEASE: "2026-09-09"
  OSS_CAD_SUITE_ARCHIVE: oss-cad-suite-linux-x64-20260909.tgz

jobs:
  axis-demux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # .gitmodules uses SSH URLs, which need a key the runner does not have.
      - name: Fetch libs/taxi submodule
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth 1 libs/taxi

      - name: Install OSS CAD Suite
        run: |
          curl -fsSL -o "$RUNNER_TEMP/$OSS_CAD_SUITE_ARCHIVE" \
            "https://github.com/YosysHQ/oss-cad-suite-build/releases/download/$OSS_CAD_SUITE_RELEASE/$OSS_CAD_SUITE_ARCHIVE"
          tar -xzf "$RUNNER_TEMP/$OSS_CAD_SUITE_ARCHIVE" -C "$RUNNER_TEMP"

      - name: Run openenoc_axis_demux tests
        working-directory: dv/core/openenoc_axis_demux
        run: |
          source "$RUNNER_TEMP/oss-cad-suite/environment"
          python3 -m pip install -r "$GITHUB_WORKSPACE/dv/requirements.txt"
          verilator --version
          python3 -m pytest test_openenoc_axis_demux.py -v
